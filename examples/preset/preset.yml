name: 论衡分档
description: 论衡（lunheng-article-pipeline）专用预设：三档 subagent 工具按角色能力分模型（检索 T1-T3 便宜快 / 分析写作 T4-T5 推理强 / 批判审计 T6+T7+T9+G14 顶配防漏判），模型经 LUNHENG_*_PROVIDER + LUNHENG_*_MODEL 环境变量覆盖。**v18.2.6 起默认不挂载**：三行 `- insert:` 改为「显式开启才装载」——不设任何 `LUNHENG_*` 时零成本（旧版默认装载，等于每会话白付 3 份与内置 `subagent` 完全同义的工具 schema）；设任一档 `*_PROVIDER`/`*_MODEL` 或 `LUNHENG_TIERING=on` 即自动装载。真源：references/_shared/模型路由.md + scripts/model-routing.mjs + 包根 cordis.patch.yml 的「分档闸门」段。
