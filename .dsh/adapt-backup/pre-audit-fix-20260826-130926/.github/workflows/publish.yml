name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # 必须：OIDC 信任发布的令牌
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          # 官方明确：发布构建不要缓存
          package-manager-cache: false

      # 仓库无 package-lock.json，用 npm install 而非 npm ci
      - name: 安装依赖
        run: npm install --global-style --no-package-lock --ignore-scripts=false

      - name: 一致性自检（复用现有脚本，失败不阻断发布）
        run: node skills/lunheng-article-pipeline/scripts/consistency-check.mjs || true

      # OIDC 信任发布：无需 NPM_TOKEN，--provenance 附来源证明
      - name: 发布到 npm
        run: npm publish --access public --provenance
