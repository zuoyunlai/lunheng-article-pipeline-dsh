# lunheng-article-pipeline bundle patch（DSH 适配版 v2.5.2-dsh.5）
#
# 本文件用 DSH cordis-plugin-include 的 `- insert:` 列表语法在 standard 组合树之上叠加 4 类 patch：
#   1. 技能 filesystem 提供者（consumer，注入 ctx.skills）：挂载本包 skills/ 目录
#   2-4. 3 档 subagent 工具（subagent_retrieval/strong/audit），按角色能力分模型
#
# DSH 架构要点（v5.5.0+）：
# - `- id: X`：覆盖已存在 id 的 config（v2.5.2-dsh.0 之前的默认语义，常误用产生"entry not found"警告）
# - `- insert: - id: X`：新增一行（不覆盖任何东西；DSH 真正推荐的 patch 模式）
# - 普通行按 id-targeted patch existing row；新增行必须用 - insert: 形式
# - `providerName` 独立命名避免与系统默认 filesystem 提供者产生歧义
# - `includeDefaultRoots: false` 避免与项目/用户根的技能根重复加载
# - `customSkillDirs` 的相对路径在挂载时由 baseUrl 解析为绝对路径（与 profile 位置无关）

# ── 1. 技能提供者（filesystem 注入）─────────────────────────────────────
- insert:
    - id: skill-filesystem-lunheng
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: skill-filesystem-lunheng
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule?.('node:url')?.fileURLToPath(new URL('node_modules/lunheng-article-pipeline/skills/', baseUrl))"

# ── 2. 检索档 subagent（T1/T2/T3 便宜快）────────────────────────────────
- insert:
    - id: tool-subagent-retrieval
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_retrieval
        backgroundMode: continuable
        agentOptions:
          provider: !!js "process.env.LUNHENG_RETRIEVAL_PROVIDER || (() => { throw new Error('LUNHENG_RETRIEVAL_PROVIDER 未设置') })()"
          model: !!js "process.env.LUNHENG_RETRIEVAL_MODEL || 'deepseek-v4-flash'"

# ── 3. 强推理档 subagent（T4/T5/T6+T9 推理强）─────────────────────────────
- insert:
    - id: tool-subagent-strong
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_strong
        backgroundMode: continuable
        agentOptions:
          provider: !!js "process.env.LUNHENG_STRONG_PROVIDER || (() => { throw new Error('LUNHENG_STRONG_PROVIDER 未设置') })()"
          model: !!js "process.env.LUNHENG_STRONG_MODEL || 'deepseek-v4-pro'"

# ── 4. 顶配档 subagent（T7 审计 + G14 检测）────────────────────────────────
- insert:
    - id: tool-subagent-audit
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_audit
        backgroundMode: continuable
        agentOptions:
          provider: !!js "process.env.LUNHENG_AUDIT_PROVIDER || (() => { throw new Error('LUNHENG_AUDIT_PROVIDER 未设置') })()"
          model: !!js "process.env.LUNHENG_AUDIT_MODEL || 'deepseek-v4-pro'"

# ── 5. 标准（DSH 默认）— 论衡示例预设（v2.5.2-dsh.5 实测 OK）──────────────
# DSH 默认包含 dsh-base / dsh-web-app / dsh-agent-presets/standard；
# 论衡不重写 standard 全部内容，只通过上述 insert: 列表叠加分档 subagent 工具。
# examples/preset/ 目录只保留 preset.yml（分档说明）+ README.md（安装指南）；
# 早期版本的 examples/preset/agent.cordis.yml（standard 全量副本，~16KB）已删除——
# DSH v5.5.0+ 的 cordis-plugin-include 用 patch 增量叠加，不再需要"凑出有效"副本。