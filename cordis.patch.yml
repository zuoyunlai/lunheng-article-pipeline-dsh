# lunheng-article-pipeline bundle patch（DSH 适配版 v2.3.7-dsh.1）
#
# 注册一个只指向本包 skills/ 目录的 filesystem 技能提供者。
# 注意：补丁层的普通行是按 id 覆盖已存在行；新增行必须用 `insert:` 列表。
# - `baseUrl` 是 profile 目录（include root），因此 customSkillDirs 解析为
#   <profile>/node_modules/lunheng-article-pipeline/skills/，与 profile 安装位置无关；
# - `providerName` 独立（filesystem-lunheng），避免与 agent 预设中的默认
#   `filesystem` 提供者产生歧义；
# - `includeDefaultRoots: false`：本行只贡献本包的技能，不重复扫描项目/用户根。
# 本行是消费行（注入 ctx.skills、不发布服务），可安全裸放，无需 isolate realm。
- insert:
    - id: skill-filesystem-lunheng
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: filesystem-lunheng
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/lunheng-article-pipeline/skills/', baseUrl))"
