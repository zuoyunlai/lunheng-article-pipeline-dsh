# lunheng-article-pipeline bundle patch（DSH 原生插件 v2.5.2-dsh.16）
#
# 本文件用 DSH cordis-plugin-include 的 `- insert:` 列表语法在 standard 组合树之上叠加 4 类 patch：
#   1. 技能 filesystem 提供者（consumer，注入 ctx.skills）：挂载本包 skills/ 目录
#   2-4. 3 档 subagent 工具（subagent_retrieval/strong/audit），按角色能力分模型
#
# DSH 架构要点（v5.5.0+）：
# - `- id: X`：覆盖已存在 id 的 config（v2.5.2-dsh.0 之前的默认语义，常误用产生"entry not found"警告）
# - `- insert: - id: X`：新增一行（不覆盖任何东西；DSH 真正推荐的 patch 模式）
# - 普通行按 id-targeted patch existing row；新增行必须用 - insert: 形式
# - `providerName` 独立命名避免与系统默认 filesystem 提供者产生歧义
# - `includeDefaultRoots: false` 避免与项目/用户根的技能根重复加载
# - `customSkillDirs` 需要**绝对路径**：provider 内部对每项做 path.resolve(root)（相对路径按进程 cwd 解析，不可靠），
#   故本文件用 `!!js` 把 URL 转成绝对路径。baseUrl 由 dsh-app-boot 锚定在** profile 目录**
#   （`ctx.baseUrl = pathToFileURL(dirname(absoluteConfigPath)).href + '/'`），且 loader 用
#   `with (ctx) { return eval(expr) }` 求值，故裸 `baseUrl` 等价于 `ctx.baseUrl`（v2.5.2-dsh.13 核验）。
#
# ⚠️ **执行面披露（v2.5.2-dsh.13 新增）**：本文件共 7 处 `!!js`（1 处路径求值 + 6 处 env 取值）。
#   `!!js` 由宿主进程以完整 Node 权限在**加载期**求值，发生在 agent 沙箱与审批关卡之前——
#   安装本包即等于允许这些表达式在启动时执行。因此：
#   - **只允许** `process.env.*`、`baseUrl`、全局 `URL`/`decodeURIComponent`/`String` 级取值；
#   - **禁止** `getBuiltinModule` / `child_process` / `require(` / `import(` / `eval(` / `new Function` / `fs.` / `node:`（CI 红线：consistency-check 规则 ⑭）；
#   - 改本文件等同于改交付物的信任边界，须主人 review。

# ── 1. 技能提供者（filesystem 注入）─────────────────────────────────────
- insert:
    - id: skill-filesystem-lunheng
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: skill-filesystem-lunheng
        includeDefaultRoots: false
        customSkillDirs:
          # 只用 process.platform + 全局 URL/decodeURIComponent（避免 getBuiltinModule 带来的模块加载面）；
          # decodeURIComponent 处理路径中的空格/中文；Windows 下去掉 file URL pathname 的前导斜杠
          - !!js "(u => process.platform === 'win32' && u.startsWith('/') ? u.slice(1) : u)(decodeURIComponent(new URL('node_modules/lunheng-article-pipeline/skills/', baseUrl).pathname))"

# ── 2. 检索档 subagent（T1/T2/T3 便宜快）────────────────────────────────
- insert:
    - id: tool-subagent-retrieval
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_retrieval
        backgroundMode: continuable
        agentOptions:
          provider: !!js "process.env.LUNHENG_RETRIEVAL_PROVIDER || undefined"
          model: !!js "(process.env.LUNHENG_RETRIEVAL_PROVIDER ? (process.env.LUNHENG_RETRIEVAL_MODEL || 'deepseek-v4-flash') : undefined)"

# ── 3. 强推理档 subagent（T4/T5/T6+T9 推理强）─────────────────────────────
- insert:
    - id: tool-subagent-strong
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_strong
        backgroundMode: continuable
        agentOptions:
          provider: !!js "process.env.LUNHENG_STRONG_PROVIDER || undefined"
          model: !!js "(process.env.LUNHENG_STRONG_PROVIDER ? (process.env.LUNHENG_STRONG_MODEL || 'deepseek-v4-pro') : undefined)"

# ── 4. 顶配档 subagent（T7 审计 + G14 检测）────────────────────────────────
- insert:
    - id: tool-subagent-audit
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_audit
        backgroundMode: continuable
        agentOptions:
          provider: !!js "process.env.LUNHENG_AUDIT_PROVIDER || undefined"
          model: !!js "(process.env.LUNHENG_AUDIT_PROVIDER ? (process.env.LUNHENG_AUDIT_MODEL || 'deepseek-v4-pro') : undefined)"

# ── 5. 标准（DSH 默认）— 论衡示例预设 ────────────────────────────────────
# ✅ 验证记录（v2.5.2-dsh.13，2026-09-11）：本段此前标注「实测 OK」却无证据；现已端到端实测——
#    装进一次性 profile 后：① 副本落位 `<profile>/node_modules/lunheng-article-pipeline/`，随包 SKILL.md 就位；
#    ② 用**已安装副本里的本表达式** + 真实 baseUrl（`file:///<profile>/`）按 loader 语义
#    （`with (ctx) { return eval(expr) }`）求值 → 得到 `<profile>/node_modules/lunheng-article-pipeline/skills/`，
#    目录真实存在且含 SKILL.md；③ `--dump-config` 中本文件的 4 段 `- insert:` 行全部进入组合树。
#    机制链依据：loader 用 `with (ctx)` 求值（故裸 `baseUrl` 等价 `ctx.baseUrl`）＋ `dsh-app-boot` 把 baseUrl
#    锚定在 profile 目录 ＋ provider 对 customSkillDirs 做 `path.resolve`（故必须绝对路径）。详见 CHANGELOG dsh.13 段。
# DSH 默认包含 dsh-base / dsh-web-app / dsh-agent-presets/standard；
# 论衡不重写 standard 全部内容，只通过上述 insert: 列表叠加分档 subagent 工具。
# examples/preset/ 目录只保留 preset.yml（分档说明）+ README.md（安装指南）；
# 早期版本的 examples/preset/agent.cordis.yml（standard 全量副本，~16KB）已删除——
# DSH v5.5.0+ 的 cordis-plugin-include 用 patch 增量叠加，不再需要"凑出有效"副本。