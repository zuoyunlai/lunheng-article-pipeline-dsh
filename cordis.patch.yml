# lunheng-article-pipeline bundle patch（DSH 原生插件 v18.0.0）
#
# 本文件用 DSH cordis-plugin-include 的 `- insert:` 列表语法在 standard 组合树之上叠加 3 档
# subagent 工具（subagent_retrieval / subagent_strong / subagent_audit），按角色能力分模型。
#
# ⚠️ **技能本身不再由本文件挂载（v18.0.0 变更）**：早期版本用一段 `- insert:` 行挂一个
#   `@deepseek-ai/dsh-skill-filesystem` 提供者（`customSkillDirs` + `includeDefaultRoots: false`）
#   来暴露本包的技能目录。v18.0.0 起改由**包入口 `lib/index.js`** 通过 `ctx.skills.register()`
#   注册技能（官方推荐的插件形态），因此：
#     · 技能目录仍随包分发在 `skills/lunheng-article-pipeline/`，入口以
#       `resourceBase: { kind: 'directory', path: <包根>/skills/lunheng-article-pipeline }` 指向它，
#       故角色卡/模板/脚本的相对引用在任意 cwd 下都能解析；
#     · 本文件因此**少了一处加载期 `!!js` 求值**（技能路径那处随之删除，见下方执行面披露）；
#     · 不再依赖内部包名 `@deepseek-ai/dsh-skill-filesystem`，也不再需要 `providerName` /
#       `includeDefaultRoots` / `customSkillDirs` 三项配置（相关推导与实测记录保留在 CHANGELOG）。
#
# DSH 架构要点（v5.5.0+）：
# - `- id: X`：覆盖已存在 id 的 config（v2.5.2-dsh.0 之前的默认语义，常误用产生"entry not found"警告）
# - `- insert: - id: X`：新增一行（不覆盖任何东西；DSH 真正推荐的 patch 模式）
# - 普通行按 id-targeted patch existing row；新增行必须用 - insert: 形式
#
# ⚠️ **执行面披露（v2.5.2-dsh.13 新增；v18.0.0 复核为 3 处）**：本文件共 3 处 `!!js`
#   （3 处分档 agentOptions：各自读 env、未设则返回 undefined）。
#   `!!js` 由宿主进程以完整 Node 权限在**加载期**求值，发生在 agent 沙箱与审批关卡之前——
#   安装本包即等于允许这些表达式在启动时执行。因此：
#   - **只允许** `process.env.*`、全局 `Object.assign` 级取值（v18.0.0 起不再需要 `baseUrl`/`URL`）；
#   - **禁止** `getBuiltinModule` / `child_process` / `require(` / `import(` / `eval(` / `new Function` / `fs.` / `node:`（CI 红线：consistency-check 规则 ⑭）；
#   - 改本文件等同于改交付物的信任边界，须主人 review。
#   - **agentOptions 取值语义已实测**（v2.5.2-dsh.17，用宿主 schemastery 3.18.2 + 与 Config 同构的 schema）：
#     `{provider: undefined, model: undefined}` ✓ 通过（规范化为 `{}`）、只给 `model` ✓ 通过、整块 `undefined` ✓ 通过。
#     故本文件采用「未设即 undefined」形态，避免传空对象触发 provider 的 agentOptions 能力门。

# ── 1. 检索档 subagent（T1/T2/T3 便宜快）────────────────────────────────
# v2.5.2-dsh.17 改写（字段独立 + 一键退路 + 不写死任何厂商默认）：
#   · **字段独立**：只给 `LUNHENG_RETRIEVAL_MODEL` 即可（`provider` 由 dsh-subagent 的
#     `resolveChildAgentOptions` 逐字段继承父级）——跨 provider 才需同时给 `_PROVIDER`；
#   · **未设 = 整块 undefined**：不传 `{}`（避免无谓触发 provider 的 agentOptions 能力门），子代理全继承会话模型；
#   · **一键退路**：`LUNHENG_TIERING=off` → 三档全部 undefined（即便其它 LUNHENG_* 已设）；
#   · **不写死厂商默认**：宿主无模型级回退，写错模型 = 该档工具直接不可用；正确模型请用
#     `node scripts/model-routing.mjs` 按本机实况生成（见 references/_shared/模型路由.md）。
- insert:
    - id: tool-subagent-retrieval
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_retrieval
        backgroundMode: continuable
        agentOptions: !!js "(e => { const p = e.LUNHENG_RETRIEVAL_PROVIDER, m = e.LUNHENG_RETRIEVAL_MODEL; if (e.LUNHENG_TIERING === 'off' || (!p && !m)) return undefined; return Object.assign({}, p ? { provider: p } : {}, m ? { model: m } : {}); })(process.env)"

# ── 2. 强推理档 subagent（T4/T5/T6+T9 推理强）─────────────────────────────
- insert:
    - id: tool-subagent-strong
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_strong
        backgroundMode: continuable
        agentOptions: !!js "(e => { const p = e.LUNHENG_STRONG_PROVIDER, m = e.LUNHENG_STRONG_MODEL; if (e.LUNHENG_TIERING === 'off' || (!p && !m)) return undefined; return Object.assign({}, p ? { provider: p } : {}, m ? { model: m } : {}); })(process.env)"

# ── 3. 顶配档 subagent（T7 审计 + G14 检测）────────────────────────────────
- insert:
    - id: tool-subagent-audit
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_audit
        backgroundMode: continuable
        agentOptions: !!js "(e => { const p = e.LUNHENG_AUDIT_PROVIDER, m = e.LUNHENG_AUDIT_MODEL; if (e.LUNHENG_TIERING === 'off' || (!p && !m)) return undefined; return Object.assign({}, p ? { provider: p } : {}, m ? { model: m } : {}); })(process.env)"

# ── 4. 标准（DSH 默认）— 论衡示例预设 ────────────────────────────────────
# 本段为说明性注释，不含 patch 行。
# ✅ 技能可用性验证（v18.0.0）：由包入口注册技能，入口执行路径有回归测试覆盖
#    （`tests/entry.test.mjs`：import 入口 → 用最小 ctx 执行 `apply` → 断言
#    `ctx.skills.register` 的 name / source / description / whenToUse / resourceBase）；
#    历史版本由本文件的技能提供者行挂载时的端到端实测记录（一次性 profile 安装 +
#    路径表达式按 loader 语义求值 + `--dump-config` 进入组合树）保留在 CHANGELOG dsh.13 段。
# DSH 默认包含 dsh-base / dsh-web-app / dsh-agent-presets/standard；
# 论衡不重写 standard 全部内容，只通过上述 insert: 列表叠加分档 subagent 工具。
# examples/preset/ 目录只保留 preset.yml（分档说明）+ README.md（安装指南）；
# 早期版本的 examples/preset/agent.cordis.yml（standard 全量副本，~16KB）已删除——
# DSH v5.5.0+ 的 cordis-plugin-include 用 patch 增量叠加，不再需要"凑出有效"副本。
