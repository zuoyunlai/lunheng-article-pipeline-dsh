name: ci

on:
  push:
    # 发版链去重（2026-10-16 批）：**不在 `v*` tag 上跑本 workflow**。
    #   理由（实测）：`publish.yml` 的 `gates` 作业已覆盖**同样四道门 + 回归**，且**更强**——门 2 带
    #   `STRICT_WARN=1`（warn 也阻塞）、测试由 `no-write-check` 包裹（= 本 job 做不到的「无改写」守卫）。
    #   故 `v*` tag 上再跑一遍 `ci` 是**纯重复**；而重复并非无害：发版流程要求「推 master **并** 推 tag」
    #   ⇒ 两者**同 commit**，而本 workflow 的并发组按 `ref` 分组 ⇒ 两个 `ci` **并发**跑重活（各含 300+
    #   包安装）互相争用，其中一个的 `loader-smoke` 在 `uninstall` 子步骤超 420s 被 abort
    #   （实测：v19.6.8 与 v19.7.0 的 **tag** run 红、**同一 commit 的 master** run 绿；v19.6.7 只推一处即绿）。
    #   非 `v*` 的 tag **仍会**触发本 workflow（`tags-ignore` 只排除 `v*`）⇒ **不留覆盖缺口**。
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

# 最小权限（v2.5.2-dsh.13）：CI 只需只读仓库，不需要任何写权限
permissions:
  contents: read

# 同一 ref 的旧运行自动取消（省 CI 分钟，避免连续推送互相等待）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # v19.11.2（反哺 2026-10-17 §P1-9）：**每个 job 都显式设 `timeout-minutes`**。
  #   病灶：8 个 job 此前零超时（`grep timeout-minutes` = 0）→ 默认吃 GitHub 的 360 分钟上限，
  #   而 `loader-smoke` 里 `npm i -g @deepseek-ai/dsh` 是外网安装（无界等待），挂死会烧满 6 小时
  #   且失败原因只剩「超时」，无法归因。取值按实测留 2–3 倍余量，不追求紧。
  # DSH 运行时下限为 Node 22.19+/24+（与 package.json 的 engines.node 一致）
  drift-check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # Actions 固定到 commit SHA（v2.5.2-dsh.13）：可变 tag 是被上游移动即可放大攻击面的供应链风险
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.19'
          package-manager-cache: false # v5 默认反转为 true；本仓**刻意不开缓存**（缓存面=供应链面）。依赖一致性改由 lockfile-frozen job 的 --frozen-lockfile 保证（v18.67.0 审计批 3：旧注释称「本仓库无 lockfile」已失效——lockfile 自 v18.66.0 起入库）
      - name: 论衡一致性自检（版本点位/白名单/口径/工具名/CHANGELOG 段落）
        run: node skills/lunheng-article-pipeline/scripts/consistency-check.mjs
      # v19.11.2（反哺 §S1 第一步）：**受管数字只有一个出口**——M 门项数 / 常驻集上限 / T8 清单件数。
      #   与上一步的分工：consistency 管「结构性可派生量」（35 条规则），本步只管**散文里最容易手抄漂**的三个数，
      #   且判据是「不得与派生值冲突」而非新增第 36 条规则。
      - name: 受管数字对账（derive-facts --check）
        run: node scripts/derive-facts.mjs --check
      # v19.11.2（反哺 §S3 第一步）：**版本头生成化**——每份文档的 `> 版本：vX` 必须等于 package.json。
      #   此前靠人工/多脚本同步 89 份文档，漏一份就是 P1 漂移（历史上已多次）。本步只判定不写盘；
      #   修法 = `node scripts/bump-version.mjs --sync`（子技能 1.0.x 不在替换面内）。
      - name: 版本头对齐（bump-version --sync --check）
        run: node scripts/bump-version.mjs --sync --check

  # lockfile 一致性门（v18.67.0 审计批 3 新增）：lockfile 自 v18.66.0 起入库，但 CI 此前**无任何**
  #   `--frozen-lockfile` 校验；而旧注释又断言「本仓库不含 lockfile」→ 前提与实现对不上，
  #   lockfile 可与 package.json 静默漂移（改依赖忘了提交 lockfile、或 resolve 结果变了没人发现）。
  #   `--frozen-lockfile` 的语义：lockfile 与 package.json 不一致时**直接失败**（不解析、不改写），
  #   正是「漂移即红」的正面判据。构建脚本审批（pnpm-workspace.yaml 的 allowBuilds）也已显式裁决，
  #   故本 job 不需要交互式 approve-builds（若将来出现未裁决条目，本 job 会红，须同批裁决）。
  lockfile-frozen:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.19'
          package-manager-cache: false # v5 默认反转为 true；本仓刻意不开缓存
      - name: lockfile 与 package.json 一致性（--frozen-lockfile，漂移即红）
        run: pnpm install --frozen-lockfile
      # v18.76.0（v18.75.1 全量架构审计 R3 修复）：**宿主契约产物探针**。
      #   为什么挂在本 job：它是 CI 里**唯一**会 `pnpm install` 的作业——探针读的是**已装宿主产物**
      #   （三处派发点的实参形态 / `materializeFinalResult` 的字段白名单 / 实装版本 == 契约表常量）。
      #   没有 node_modules 就没有可核对的产物事实，而 R3 的病根正是「门只比本包自己的形参个数、
      #   从不读宿主产物」。`--require-host`：本作业里产物必须存在，缺失即红（本地裸仓库无依赖时
      #   同一命令判 N/A 并 exit 0，见脚本头注释）。
      - name: 宿主契约产物探针（三处派发点 + 结果字段白名单 + 版本一致）
        run: node scripts/host-contract-probe.mjs --require-host

  # 打包面检查：cordis.patch.yml 合法性 / 行 id 唯一 / dsh.bundle.patch 指向 /
  # package.json 元数据 / 工程红线（与 drift-check 互补，互不重叠）
  # node-version 用 24 而非 22.19：Node 22.19 自带的 npm 10.9.3 无法安装本检查所用的
  # dsh-plugin-guide（该包声明 optional peerDependency，npm 10 的 arborist 崩）——
  # 运行时下限仍由 drift-check（22.19）覆盖；脚本自身另走 pnpm dlx 优先的多策略。
  #
  # ⚠️ **为什么不加 `cache: 'pnpm'`（v18.2.4 审计 F.1 的结论保留，前提已更新）**：
  #   ① **前提更新（v18.67.0 审计批 3）**：本仓**自 v18.66.0 起已入库 lockfile**
  #      （`pnpm-lock.yaml` + `pnpm-workspace.yaml`）——旧注释「本仓库不含任何 lockfile」已失效，
  #      当时否决缓存的第一条理由（缺锁文件会让 `cache: pnpm` 直接失败）随之失效。
  #   ② 但**结论维持不缓存**：本 job 只用 `pnpm dlx` 取一次性 CLI，并不 `pnpm install`；
  #      为省几十秒引入一个可变 key 的缓存面，收益 < 供应链与陈旧缓存风险。
  #      **依赖一致性不再靠「没有 lockfile」兜底，而由 `lockfile-frozen` job 的
  #      `pnpm install --frozen-lockfile` 正面校验**（v18.67.0 新增，勿删——它替掉了旧前提）。
  #   ⚠️ **v5 陷阱（v18.2.5 实测踩到）**：`actions/setup-node@v5` 把 `package-manager-cache` 的默认值
  #      从 false **反转为 true** —— 等于替我们「顺手补上了缓存」，且失败形态与 ① 预判的**不同**：
  #      实测 CI 全 5 job 红，报 `Unable to locate executable file: pnpm`（runner 上无 pnpm 二进制，
  #      而本仓 `packageManager: pnpm@11.7.0` 令 v5 判定「该按 pnpm 缓存」→ 先探测 pnpm 命令即失败）。
  #      故：**本仓所有 `setup-node` 步骤必须显式写 `package-manager-cache: false`，勿删**（v4 时期
  #      不写是安全的，v5 起不写就等于打开缓存）。
  plugin-surface:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false # v5 默认反转为 true；本仓**刻意不开缓存**（缓存面=供应链面）。依赖一致性改由 lockfile-frozen job 的 --frozen-lockfile 保证（v18.67.0 审计批 3：旧注释称「本仓库无 lockfile」已失效——lockfile 自 v18.66.0 起入库）
      - name: 打包面检查（dsh-plugin-dev check，v18.0.0 起无豁免）
        # v18.76.0（v18.75.1 全量架构审计 R7-Q4 修复）：**与发布门同源开 `STRICT_WARN=1`**。
        #   此前只有 `publish.yml` 开这一项 → warn 级问题会**累积到打 tag 那一刻**才红（发布前才发现 =
        #   已经在 tag 上），而 `scripts/plugin-surface-check.mjs` 的注释自述「CI 与发布门统一打开」——
        #   承诺与实现不一致。本仓当前实测 0 warn（11 通过 / 0 失败 / 0 提示 / 3 skip），故本项改动零风险。
        env:
          STRICT_WARN: '1'
        run: node scripts/plugin-surface-check.mjs

  # 机械卫生门（v2.5.2-dsh.13 新增）：语法 / JSON / YAML 结构 / 行尾 / UTF-8 / 发布包内容
  # 零依赖（纯 Node 内置 + git/npm CLI），故可跑在运行时下限 22.19 上
  hygiene:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.19'
          package-manager-cache: false # v5 默认反转为 true；本仓**刻意不开缓存**（缓存面=供应链面）。依赖一致性改由 lockfile-frozen job 的 --frozen-lockfile 保证（v18.67.0 审计批 3：旧注释称「本仓库无 lockfile」已失效——lockfile 自 v18.66.0 起入库）
      - name: 仓库机械卫生门
        run: node scripts/repo-hygiene-check.mjs

  # 打包产物冒烟（v18.0.5 新增，第三方审计 P1-7）：`npm pack` → 解包 → **真跑解包后入口的 apply**，
  # 断言「自注册行恰一行 / patch 行名已声明 / 技能注册 / frontmatter 剥离 / resourceBase 指向解包目录 /
  # tests 不随包」。补的是此前**没有任何 job 覆盖**的「发布物能不能被装载」这一段
  # （v18.0.0「装了但技能不注册」正是发生在这些门都够不到的地方）。
  # 注意：它**不等于**官方 `dsh-plugin-dev verify`（不启动真实 profile）——本机 verify 受 DSH Desktop
  # 的 dsh shim（硬编码 DSH_HOME）与 pnpm 原生依赖策略阻断，故用等效冒烟替代并在文档里如实标注。
  #
  # v18.2.9（第三方审计 B7）：pack-smoke 内部有 **win32 分支**（npm pack/tar 的平台差异），
  #   旧版只跑 ubuntu = 跨平台易碎代码从未在 CI 的 win/mac 上执行过。零依赖、成本低，故进三平台矩阵。
  pack-smoke:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false # v5 默认反转为 true；本仓**刻意不开缓存**（缓存面=供应链面）。依赖一致性改由 lockfile-frozen job 的 --frozen-lockfile 保证（v18.67.0 审计批 3：旧注释称「本仓库无 lockfile」已失效——lockfile 自 v18.66.0 起入库）
      - name: 打包产物冒烟（npm pack → 解包 → 入口 apply）
        run: node scripts/pack-smoke.mjs

  # 真实 Loader 冒烟（v18.2.9，第三方审计 A11）：走官方 `dsh-plugin-dev verify`
  #   （pnpm pack → 装入干净 mkdtemp DSH_HOME profile → 安装 + 启动 + 卸载冒烟）。
  #   补的是 pack-smoke（mock ctx）与 plugin-surface（静态门）都够不到的「真实 profile 装载」这一层——
  #   正是 DSH 官方「手动挂载测不到 Loader 层」的事故模式。
  # verify 的 --dsh 默认「从 PATH 找 dsh」，故先 npm 全局装 @deepseek-ai/dsh（compat pin 要求 ≥0.1.5-rc.1）；
  # verify 内部每条 dsh 命令都带 env: DSH_HOME=mkdtemp 隔离，不依赖全局 DSH_HOME（本机已实测 verify 全绿）。
  # ⚠️ v18.12.1（收口补丁）：pin 由 0.1.5-rc.2 抬到 **0.1.7-rc.2** —— 旧 pin 下本 job **每次必红**，
  #   根因是上游 `dsh-app-boot` 在 `patchReload: "live"`（`dsh plugin add` 生成的默认值）且无 HMR 时抛错，
  #   与本包代码无关（`pack / install / dump-config` 三个前置子步全过）。详见步骤内注释与
  #   `skills/lunheng-article-pipeline/references/maintainers.md` §五（含本机复现步骤与三条处方）。
  loader-smoke:
    # 外网安装 dsh（可无界等待）——本仓最大超时面，给足但必须有界。
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false # v5 默认反转为 true；本仓**刻意不开缓存**（缓存面=供应链面）；依赖一致性由 lockfile-frozen job 保证
      - name: 装 dsh（verify 的 --dsh 默认从 PATH 找）
        # v18.12.1（收口补丁）：0.1.5-rc.2 → **0.1.7-rc.2**。原因（用 `npm pack` 逐版核对过 app-boot）：
        #   0.1.5-rc.2 与 rc.3 的 `dsh-app-boot` 仍在 `patchReload === "live"` 时调 `watchUserPatches()`，
        #   而该函数拿不到 `ctx.get('hmr')` 就抛 `requires the Cordis HMR service` → **headless 冒烟必红**
        #   （该 profile manifest 由 `dsh plugin add` 写成 `patchReload: "live"`，非本包可控；本机已复现）。
        #   0.1.7-rc.2 的 app-boot 里 `patchReload` 与那条 HMR 守卫**都已不存在**，并内置 `headless`
        #   profile（`bundles: [dsh-base, dsh-headless]` + `headless-runner`）→ 该子步可跑通。
        # v19.11.1：**本 job 保持单 leg（0.1.7-rc.2）**——官方 verify 的 compat profile 模板仍钉
        #   `@deepseek-ai/dsh-headless@0.1.5-rc.1`（peer `^0.1.5-rc.1`），在 0.2.x 宿主上 install 必拒；
        #   0.2.x 线的真实装载证据改由下面的 `install-smoke` 提供（上游模板问题，非本包缺陷）。
        run: npm i -g @deepseek-ai/dsh@0.1.7-rc.2
      - name: 真实 Loader 冒烟（官方 dsh-plugin-dev verify）
        env:
          DSH_PLUGIN_DEV_TIMEOUT: '420000'
        # 三次复审 N-3：CLI 版本**从唯一 pin 点派生**（此前此处硬编码 `@0.3.16`，与
        #   `scripts/plugin-surface-check.mjs` 的 `0.3.19` 分叉）。改用 `--print-cli-spec` 后，
        #   抬 pin 只需改一处；`repo-hygiene-check` 规则 ⑭ 守住「运行面不得出现第二处 pin」。
        run: |
          SPEC="$(node scripts/plugin-surface-check.mjs --print-cli-spec)"
          echo "loader-smoke 使用的 CLI pin：$SPEC（单点来源 = scripts/plugin-surface-check.mjs）"
          pnpm dlx "$SPEC" verify .

  # 真实安装烟测（v19.11.1 新增）：`VERIFIED_HOST_VERSIONS` 白名单的**真实 `dsh plugin add`** 证据。
  #   为什么不用 loader-smoke 跑 0.2.x：官方 verify 的 compat profile 模板固定装
  #     `@deepseek-ai/dsh-headless@0.1.5-rc.1`（peer `^0.1.5-rc.1`），在 0.2.1-rc.2 上
  #   `dsh plugin add` 会以「headless incompatible」拒绝（CI 日志实测，属上游模板而非本包）。
  #   本 job 用仓库既有的 `scripts/host-install-smoke.mjs`：真发布物（npm pack）→ 隔离 DSH_HOME →
  #   真实 `dsh plugin add` → `--dump-config` 断言本包自注册层；同时保留 0.1.7 leg 防脚本自身漂移。
  install-smoke:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.1.7-rc.2', '0.2.1-rc.2']
    name: install-smoke (${{ matrix.dsh }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false # v5 默认反转为 true；本仓**刻意不开缓存**（缓存面=供应链面）
      - name: 装 dsh · ${{ matrix.dsh }}
        run: npm i -g @deepseek-ai/dsh@${{ matrix.dsh }}
      - name: 真实安装烟测（dsh plugin add → dump-config 断言自注册层）
        run: node scripts/host-install-smoke.mjs

  # 随包脚本回归测试（v2.5.2-dsh.13 新增）
  # 矩阵含 windows-latest 与 macos-latest：final-check 的 POSIX 崩溃、路径含空格、
  # 行尾/编码差异等缺陷**只在非作者平台或跨平台时才暴露**（作者本机为 Windows）
  #
  # v18.2.6 加 Node 维度（第三方审计「Node 矩阵未覆盖 engines 的 ≥24 侧」）：
  #   `engines.node` = `^22.19.0 || >=24.0.0`，而此前**唯一跑测试的作业**固定 22.19 →
  #   **≥24 侧只在发版那一刻由 publish 作业的回归测试验证一次**（发布时才第一次发现「24 上有问题」，
  #   而 npm 版本不可覆盖 ⇒ 只能 bump 重发）。现矩阵加 `24`，为省 CI 分钟**只跑 ubuntu**
  #   （跨平台 × 跨 Node 的组合收益递减：平台差异与 Node 版本差异是两个正交面，各覆盖一次即可）。
  script-tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19']            # 运行时下限（engines 的左半边）
        include:
          - os: ubuntu-latest
            node: '24'             # engines 的 ≥24 侧：ubuntu 上跑一次即可
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false # v5 默认反转为 true；本仓**刻意不开缓存**（缓存面=供应链面）。依赖一致性改由 lockfile-frozen job 的 --frozen-lockfile 保证（v18.67.0 审计批 3：旧注释称「本仓库无 lockfile」已失效——lockfile 自 v18.66.0 起入库）
      - name: 随包脚本回归测试（node --test）
        # 用引号保护的 glob：让 Node 自己展开（bash 与 pwsh 都能原样传递）
        # CI 用**标准隔离模式**（受限 DSH 会话里的 `--test-isolation=none` 降级跑法只用于本地，见 CONTRIBUTING）
        # v18.18.3（审计 D-1③）：补 `skills/*/tests/**` —— 子技能 `lunheng-commands` 的
        # route.test.mjs（22 用例）此前**不在任何自动触发点**：根 test 脚本只 glob `tests/**`，
        # 本工作流 grep `lunheng-commands` 0 命中。它只靠人手动跑，等于没有回归网。
        # 该 glob 与 package.json 的 `test` / `test:no-isolation` 三处同形。
        # v19.6.1（全量审计-2026-10-15 **P2-24**）：本行原写「判据 = 用例总数 289」，那是**当时的**实测值，
        #   早已过期（套件随版本增长）。按本仓既定纪律（「此处不再抄数字，防『加规则忘改数字』」）撤掉绝对值：
        #   真正的不变量是「三处 glob 同形且都含 `skills/*/tests/**`」，不是某个数字。
        #
        # v18.46.0：**用 no-write-check 包住同一条命令**——它先对全仓文件做 sha256 快照，再跑下面这条
        #   完全相同的测试命令，最后比对（有改写 → exit 1 并逐文件点名）。
        #   **代价 = 0**：跑的还是同一次套件，不增加运行时长；换来的是一道**此前没有的**守卫——
        #   「测试或工具偷偷写进真仓库」（忘了用临时夹具 / 把「检查」实现成「修复」/ 路径推导偏到真源树）。
        #   它同时是 v18.44.0 那起**未定位成因**的改写事故在 CI 侧的固定观察点。
        # v19.6.1（全量审计-2026-10-15 **F-5**）：**补上 `--test-timeout`**。此前这一条（包裹跑）
        #   没有超时旗标，而下一条（裸跑）有 —— 同一个全量套在 CI 内部就有两把尺；更严重的是
        #   **包裹跑**那一支挂死的用例只能等 GitHub job 上限（数十分钟且难归因）。
        #   旗标值与 `package.json#scripts.test` 同源（180000）；机械对账见
        #   `tests/no-write-check.test.mjs` 的「CI/publish 包裹跑与裸跑旗标一致」源码钉。
        run: node scripts/no-write-check.mjs -- node --test --test-timeout=180000 "tests/**/*.test.mjs" "skills/*/tests/**/*.test.mjs"
      # v18.62.4（全量审计-v18.62.3 P1-11）：**这一条曾不存在，而上面那条包装曾吞掉测试退出码**——
      #   `no-write-check` 旧版只看「有没有改写」与「命令是否存在（ENOENT）」，被包命令退出非 0
      #   既不判负也不透传 → **整个套件**在 PR/push 上**完全不阻塞**，只剩 `publish.yml`（打 tag 时）
      #   才拦，为时已晚。现两头收口：① 包装器内部把「被包命令 exit≠0」判负；② 再加下面这一步**裸跑**
      #   同一 glob —— 即使将来包装器语义再变，测试失败也一定红，且失败细节直接落在 GitHub 的测试报告里。
      #   `--test-timeout` 与 `package.json#scripts.test` 同源：此前三处 glob 同形而超时参数只有
      #   package.json 有 → CI 里挂死的用例永不超时。
      - name: 全量套（裸跑，阻塞）
        run: node --test --test-timeout=180000 "tests/**/*.test.mjs" "skills/*/tests/**/*.test.mjs"
