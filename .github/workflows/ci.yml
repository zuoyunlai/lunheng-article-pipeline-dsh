name: ci

on:
  push:
  pull_request:

# 最小权限（v2.5.2-dsh.13）：CI 只需只读仓库，不需要任何写权限
permissions:
  contents: read

# 同一 ref 的旧运行自动取消（省 CI 分钟，避免连续推送互相等待）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DSH 运行时下限为 Node 22.19+/24+（与 package.json 的 engines.node 一致）
  drift-check:
    runs-on: ubuntu-latest
    steps:
      # Actions 固定到 commit SHA（v2.5.2-dsh.13）：可变 tag 是被上游移动即可放大攻击面的供应链风险
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19'
      - name: 论衡一致性自检（版本点位/白名单/口径/工具名/CHANGELOG 段落）
        run: node skills/lunheng-article-pipeline/scripts/consistency-check.mjs

  # 打包面检查：cordis.patch.yml 合法性 / 行 id 唯一 / dsh.bundle.patch 指向 /
  # package.json 元数据 / 工程红线（与 drift-check 互补，互不重叠）
  # node-version 用 24 而非 22.19：Node 22.19 自带的 npm 10.9.3 无法安装本检查所用的
  # dsh-plugin-guide（该包声明 optional peerDependency，npm 10 的 arborist 崩）——
  # 运行时下限仍由 drift-check（22.19）覆盖；脚本自身另走 pnpm dlx 优先的多策略。
  #
  # ⚠️ **为什么不加 `cache: 'pnpm'`（v18.2.4 审计 F.1 否决，勿再"顺手补上"）**：
  #   ① 本仓库**不含任何 lockfile**（无 pnpm-lock.yaml / package-lock.json）——`actions/setup-node`
  #      的 `cache: pnpm` 在缺锁文件时**直接失败**（`Dependencies lock file is not found ...
  #      Supported file patterns: pnpm-lock.yaml`），即照字面实施会**把 CI 弄红**；
  #   ② 即便补上锁文件，缓存键只能哈希锁文件，而本 job 并不 `pnpm install`（只用 `pnpm dlx` 取
  #      一次性 CLI）——为省几十秒引入一个可变 key 的缓存面，收益 < 供应链与陈旧缓存风险。
  #   结论：**维持不缓存**；若将来本仓库引入 lockfile 并固定依赖，可连同 pin 一起重新评估。
  plugin-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 打包面检查（dsh-plugin-dev check，v18.0.0 起无豁免）
        run: node scripts/plugin-surface-check.mjs

  # 机械卫生门（v2.5.2-dsh.13 新增）：语法 / JSON / YAML 结构 / 行尾 / UTF-8 / 发布包内容
  # 零依赖（纯 Node 内置 + git/npm CLI），故可跑在运行时下限 22.19 上
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19'
      - name: 仓库机械卫生门
        run: node scripts/repo-hygiene-check.mjs

  # 打包产物冒烟（v18.0.5 新增，第三方审计 P1-7）：`npm pack` → 解包 → **真跑解包后入口的 apply**，
  # 断言「自注册行恰一行 / patch 行名已声明 / 技能注册 / frontmatter 剥离 / resourceBase 指向解包目录 /
  # tests 不随包」。补的是此前**没有任何 job 覆盖**的「发布物能不能被装载」这一段
  # （v18.0.0「装了但技能不注册」正是发生在这些门都够不到的地方）。
  # 注意：它**不等于**官方 `dsh-plugin-dev verify`（不启动真实 profile）——本机 verify 受 DSH Desktop
  # 的 dsh shim（硬编码 DSH_HOME）与 pnpm 原生依赖策略阻断，故用等效冒烟替代并在文档里如实标注。
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 打包产物冒烟（npm pack → 解包 → 入口 apply）
        run: node scripts/pack-smoke.mjs

  # 随包脚本回归测试（v2.5.2-dsh.13 新增）
  # 矩阵含 windows-latest 与 macos-latest：final-check 的 POSIX 崩溃、路径含空格、
  # 行尾/编码差异等缺陷**只在非作者平台或跨平台时才暴露**（作者本机为 Windows）
  script-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19'
      - name: 随包脚本回归测试（node --test）
        # 用引号保护的 glob：让 Node 自己展开（bash 与 pwsh 都能原样传递）
        run: node --test "tests/**/*.test.mjs"
