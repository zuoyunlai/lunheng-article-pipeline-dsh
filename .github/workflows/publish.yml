name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动补 dist-tag（如 latest 未跟随最新版时）

# 默认最小权限（v18.2.6 拆分）：`gates` 作业持有下面这一档；发布令牌只在 `publish` 作业里提权。
permissions:
  contents: read

# 同一 tag 的发布不并发（发布是不可逆动作）
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PKG: lunheng-article-pipeline

jobs:
  # ── 发布前四道门 + 回归测试（v18.2.6 从 publish 作业里拆出来）──────────────────────
  # 为什么拆（第三方审计「CLI 门的外部依赖被排除在供应链考虑之外」）：
  #   门 2 会**从 registry 现场下载并执行**第三方 CLI（`dsh-plugin-guide`，见 scripts/plugin-surface-check.mjs 的
  #   获取链）。此前它跑在**持有 `id-token: write` + `NPM_TOKEN` 的发布作业**里 —— 等于让一个下载来的包在
  #   发布身份面前执行。拆开后：本作业 `contents: read`、**无 id-token、不读任何 secret**，只跑门与测试；
  #   `publish` 作业 `needs: gates`，门失败即**不可能**开始发布。
  # 保守改动声明：只调整作业边界与权限，不改任何既有发布语义（OIDC / `--tag dsh` / 幂等守卫 / gitHead 断言全部保留）。
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions 固定到 commit SHA（v2.5.2-dsh.13）：可移动的大版本 tag 一旦被上游改动即可被利用来发布恶意版本
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'   # 门 2 需要 Node 24：Node 22.19 自带的 npm 10.9.3 无法安装本检查所用的 dsh-plugin-guide
          package-manager-cache: false # v5 把默认值反转为 true；本仓库无 lockfile 且不 pnpm install（v18.2.4 审计 F.1 维持不缓存）

      # ── 四道门（fail-closed：任一不过即中止，绝不发布未校验内容）──────────────────
      - name: 门 1/4 一致性自检（版本/白名单/口径/工具名/CHANGELOG 段落）
        run: node skills/lunheng-article-pipeline/scripts/consistency-check.mjs

      - name: 门 2/4 打包面检查（bundle 契约 + package.json 元数据 + patch 行依赖 + 工程红线）
        # STRICT_WARN=1（v18.2.6）：warn 也阻塞——「0 warn」此前只是文档承诺，代码只看 failed === 0
        env:
          STRICT_WARN: '1'
        run: node scripts/plugin-surface-check.mjs

      - name: 门 3/4 机械卫生门（语法/JSON/YAML/行尾/UTF-8/发布包内容/退出码契约）
        run: node scripts/repo-hygiene-check.mjs

      - name: 门 4/4 打包产物冒烟（npm pack → 解包 → 入口 apply 真跑）
        run: node scripts/pack-smoke.mjs

      - name: 随包脚本回归测试（根测试 + 内嵌子技能测试）
        # v18.57.x（审计修订 P1-2）：旧版只有 1 个 glob，漏掉 `skills/*/tests/**`——
        #   子技能 lunheng-commands 的 route.test.mjs（22 用例）不在发布 gates 的验证范围内，
        #   而它定义着 11 个 /lunheng 命令。现与 package.json 的 test / ci.yml 的 script-tests 同形。
        run: node --test "tests/**/*.test.mjs" "skills/*/tests/**/*.test.mjs"

  # ── 发布（唯一持有发布身份的作业）─────────────────────────────────────────────
  publish:
    needs: gates                 # 门失败即不发布（v18.2.6：断链式依赖，比同作业内串跑更强）
    runs-on: ubuntu-latest
    permissions:
      id-token: write            # 必须：OIDC 信任发布的令牌（只在本作业提权）
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'   # Trusted Publishing 要求 npm ≥11.5.1；Node 24 自带 npm 已满足（不再 `npm i -g npm@latest`，避免发布环境不可复现）
          package-manager-cache: false # v5 把默认值反转为 true；本仓库无 lockfile 且不 pnpm install（v18.2.4 审计 F.1 维持不缓存）
          registry-url: 'https://registry.npmjs.org'

      # 防误发：git tag 名必须与 package.json version 一致（仅 tag 触发时校验）
      - name: 校验 tag 与版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::git tag $TAG 与 package.json version ${VER#v} 不一致，拒绝发布（防版本超前误发）"
            exit 1
          fi

      # 幂等守卫（v2.5.2-dsh.13）：该版本已发布 → 跳过发布（含补打历史 tag 的场景），避免 EPUBLISHCONFLICT 噪声
      # ⚠️ 补打历史 tag 的连带后果（2026-09-22 实测）：乱序发布时，每个 tag 的 `npm publish --tag dsh` 都会覆盖
      #    `dsh` dist-tag，最终停在**最后完成的旧版**而非最新版。补推后须手工 `npm dist-tag add …@<最新> dsh`
      #    （`latest` 同理）——完整口径见 CONTRIBUTING §升级流程「补推历史 tag」条。
      - name: 幂等检查（已发布则跳过）
        id: guard
        run: |
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "已存在于 npm：$PKG@$VER → 跳过发布步骤"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "待发布：$PKG@$VER"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # OIDC 信任发布：无需 NPM_TOKEN，--provenance 附来源证明；
      # 预发布版（-dsh.N）显式打 dsh tag（仅 tag 触发且未发布时执行）
      - name: 发布到 npm
        id: publish
        if: startsWith(github.ref, 'refs/tags/') && steps.guard.outputs.skip == 'false'
        run: npm publish --access public --provenance --tag dsh

      # dist-tag 核对与**前移**。要点：
      #   ① OIDC 发布已由 `npm publish --tag dsh` 自动把 dsh 指向本次版本 —— **不需要**再 add 一次；
      #   ② 旧世界：`npm dist-tag` 需写鉴权，而本仓 2026-09-29 决定不配 NPM_TOKEN → `latest` **不会**自动前移，
      #      每次发版后由维护者手工补打（v18.62.0 就因漏补而让包页与「不带版本的安装命令」双双停在旧版）。
      #   ③ **v18.62.8 起改为 OIDC 自动前移**：npm 于 **2026-09-30** 为 trusted publishing 新增 **opt-in 的
      #      dist-tag 权限**（`Allow npm dist-tag`，与直接 publish 权限**相互独立**、**默认关闭**）——
      #      「CI 动不了 latest」这一**技术前提当日消失**（本轮实测发现，故本条是**前提已变的旧决策修正**，
      #      不是推翻 2026-09-29 的**意图**——那次决定的理由是「不引入需 90 天轮换的长期凭据」，OIDC 恰好不需要它）。
      #      两个前提（缺一即走下方 warning 分支，**永不失败**）：
      #        · npm 侧：该包的 trusted publisher 配置里勾上 `Allow npm dist-tag`（**一次性人工动作**，见 SECURITY.md §NPM_TOKEN 治理）；
      #        · CLI 侧：npm **≥ 11.21.0**（Node 24 自带 11.19.0 → 故本步**显式安装 pinned npm**）。
      #      为什么 `npm i -g` 放在**发布之后**：发布用的仍是 runner 自带 npm（发布环境可复现性不变），
      #        这里只影响本步的 dist-tag 写入。
      #   ④ **不回退**：仅当 registry 上**不存在更新版本**时才前移 `latest` —— 补推历史 tag 的 run
      #      不会把 dist-tag 拉回旧版。**判据必须是「有无更新版本」，不能是 `npm view $PKG version`**
      #      （后者解析的就是 `latest` 标签本身 → 首跑实测的自我否定缺陷，见下方 v18.62.9 注）。
      #   ⑤ 两处坑照旧（**手工兜底路径**仍适用）：本机 `~/.npmrc` 默认 registry 是只读镜像 → 手工命令**必须**带
      #      `--registry=https://registry.npmjs.org`；且必须等 publish 作业 success 之后再改 tag（否则 E404）。
      - name: 核对并前移 dist-tag（OIDC 优先 / token 兜底 / 失败不阻断）
        # v18.2.9（第三方审计 B8）：dispatch 限定默认分支——凭据作业只允许从默认分支手动触发。
        #   tag 触发路径不受影响（tag 本身即受保护语义）。
        if: (steps.guard.outputs.skip == 'false' || github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          # v18.62.8 修（旧实现从未真正生效）：setup-node 写的 `.npmrc` 读的是 `NODE_AUTH_TOKEN`，
          #   而旧版只注入了 `NPM_TOKEN` → token 分支即使配上凭据也走不到。现两者都给。
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          echo '--- 发布后 dist-tags（前） ---'
          npm view "$PKG" dist-tags --json
          # ⚠️ v18.62.9 修（**本步首跑实测抓出的自证缺陷**）：判据**不能**用 `npm view "$PKG" version`
          #   ——它解析的是 **`latest` 标签指向的版本**，而 `latest` 正是**坏掉的那个**：
          #   首跑实测日志「本次版本=18.62.8 ｜ registry 最新=18.62.7」→ 守卫直接 exit 0，
          #   **恰恰在最需要它的场景（latest 落后）拒绝修 latest**（自我否定）。
          #   正确判据 = **「是否存在严格更新的版本」**：`@>$VER` 无匹配时 npm 报 E404（故 `|| true` 兜住 `bash -e`）。
          NEWER="$(npm view "$PKG@>$VER" version 2>/dev/null | tr -d '[:space:]' | tail -n1 || true)"
          if [ -n "$NEWER" ]; then
            echo "::notice::registry 上存在更新版本（$NEWER）→ 本次 $VER 是补推的历史 tag，**不动** latest，避免把 dist-tag 拉回旧版。如需前移，对最新版所在的 tag 重跑本工作流。"
            exit 0
          fi
          echo "本次版本=$VER 确认为 registry 最新版（无更新版本）"
          # CLI 侧前提：dist-tag 的 OIDC 权限自 npm 11.21.0 起支持 → 显式装 pinned 版（确定性优先，不做版本比较分支）
          npm install -g npm@11.21.0 --no-audit --no-fund >/dev/null 2>&1 || true
          echo "npm $(npm --version)（dist-tag OIDC 需 ≥11.21.0）"
          if npm dist-tag add "$PKG@$VER" latest; then
            echo "✓ latest 已前移 → $VER（**OIDC trusted publishing**，无需任何长期凭据）"
          elif [ -n "${NPM_TOKEN}" ]; then
            if npm dist-tag add "$PKG@$VER" latest --registry=https://registry.npmjs.org; then
              echo "✓ latest 已前移 → $VER（NPM_TOKEN 兜底路径）"
            else
              echo "::error::NPM_TOKEN 存在但鉴权失败（E401 = 令牌已失效/被撤销/无 dist-tag:write 范围）——**发布本身已成功、无需重发**。请在 npm 侧换发细粒度 token 后 gh secret set NPM_TOKEN，或（推荐）改为在 npm 侧开启 OIDC dist-tag 权限后重跑本工作流；临时兜底：npm dist-tag add $PKG@$VER latest --registry=https://registry.npmjs.org"
              exit 1
            fi
          else
            echo "::warning::latest 未自动前移（OIDC dist-tag 权限未开启，且本仓未配 NPM_TOKEN）。**发布本身已成功、无需重发**。闭合路径二选一：①（推荐，一次性）npmjs.com → 该包 Settings → Trusted Publishers → 为 publish.yml 勾选 **Allow npm dist-tag** → 重跑本工作流；②（兜底）本地执行 npm dist-tag add $PKG@$VER latest --registry=https://registry.npmjs.org（核验用 node scripts/dist-tag-check.mjs 或查注册表 API，勿只信 npm view 的本机缓存）"
          fi
          echo '--- 发布后 dist-tags（后） ---'
          npm view "$PKG" dist-tags --json

      # 发布后审计：核对 npm 上该版本的 gitHead 与本次提交一致、dist-tag 指向本版本。
      # v2.5.2-dsh.14 修（实测教训）：**registry 元数据有传播延迟**——publish 步骤刚成功就 `npm view gitHead`
      # 会拿到空值，旧写法因此误判「产物与 tag 不对应」并红灯（dsh.14 首跑即如此，事后核验 gitHead 其实完全正确）。
      # 现改为**轮询等待**，并把「取不到」与「取到但不一致」区分开。
      # v2.5.2-dsh.16 再修（dsh.16 首跑实测）：publish 日志明写
      # 「Your package is being processed and may take a few minutes to become available」——**120s 窗口仍不够**
      # （本次 gitHead 实际在 ~10 分钟后可取到，且与 HEAD 完全一致）。故：
      #   ① 窗口放宽到 30 × 15s（≈7.5 分钟），并在等待时提示 npm 的「处理中」语义；
      #   ② **取不到 = 告警**（::warning::，exit 0）——发布步骤自身已由 npm 返回成功 + provenance 签署，
      #      元数据传播延迟不是本仓库缺陷，不该把运行弄红；
      #   ③ **取到但不一致 = 硬错误**（真正的产物/tag 不对应，必须拦）。
      # `always()` 确保即使中间某步失败（如缺 token 的告警步）也仍执行审计——但只在**发布本身成功**时才有意义。
      - name: 发布后审计（gitHead / dist-tags 断言）
        if: always() && startsWith(github.ref, 'refs/tags/') && steps.guard.outputs.skip == 'false' && steps.publish.outcome == 'success'
        run: |
          VER="$(node -p "require('./package.json').version")"
          HEAD="$(git rev-parse HEAD)"
          GITHEAD=""
          for i in $(seq 1 30); do
            GITHEAD="$(npm view "$PKG@$VER" gitHead 2>/dev/null | tr -d '[:space:]')"
            [ -n "$GITHEAD" ] && break
            echo "registry 元数据尚未就绪，等待中（第 $i/30 次，每次 15s）—— npm 可能仍在处理发布（其提示：may take a few minutes to become available）"
            sleep 15
          done
          echo "npm gitHead=$GITHEAD  repo HEAD=$HEAD"
          if [ -z "$GITHEAD" ]; then
            echo "::warning::7.5 分钟内未取到 npm 上 $VER 的 gitHead —— registry 元数据传播延迟（发布本身已成功：publish 步骤退出 0 + provenance 已签署）。请人工核对：npm view $PKG@$VER gitHead 应等于 $HEAD"
          elif [ "$GITHEAD" != "$HEAD" ]; then
            echo "::error::npm 上 $VER 的 gitHead($GITHEAD) ≠ 本次提交($HEAD) —— 发布产物与 tag 不对应（真实缺陷，必须处理）"
            exit 1
          else
            echo "✓ gitHead 与本次提交一致"
          fi
          DSH_TAG="$(npm view "$PKG" dist-tags.dsh 2>/dev/null | tr -d '[:space:]')"
          echo "dist-tags.dsh=$DSH_TAG"
          if [ "$DSH_TAG" != "$VER" ]; then
            echo "::warning::dist-tags.dsh=$DSH_TAG ≠ $VER（若已配置 NPM_TOKEN 则不应发生；无 token 时属预期：publish --tag dsh 会自动指向本版本）"
          fi

  # ── GitHub Release（2026-09-21 新增）────────────────────────────────────────────
  # 为什么此前一直缺（如实记录，这是本作业存在的唯一理由）：publish.yml 从建库起就只有
  #   「npm 发布」没有「建 release」两步中的任何一步——GitHub Release 全靠维护者手工
  #   `gh release create` 补。漏补就停更：v18.2.5 / 18.2.6 / 18.2.8 / 18.2.9 / 18.3.0
  #   五版**均无 Release**（releases 页面长期停在 v18.2.1），直到 2026-09-21 手工补 v18.3.0
  #   时才暴露。本作业把这一步自动化，使「push tag → npm 发布 → GitHub Release」全链闭环。
  # 为什么**单独一个作业**（而不是塞进 publish）：建 release 需要 `contents: write`，而
  #   `publish` 作业已持有 `id-token: write`（发布身份）——两者同作业会让「发布身份」同时
  #   具备仓库写权。拆开后各持最小权限（与 gates / publish 的拆分同一思路）。
  # 为什么用**内建 `gh` CLI**而不是第三方 action：本仓 Action 一律 pin commit SHA（供应链纪律），
  #   而 `gh` 是 runner 预装的内建工具——零新增供应链面，也不引入需要跟踪的上游 SHA。
  # 幂等：已存在的 tag 重跑（含手工补过 release 的场景）只打印跳过，不会重复创建或改资产。
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 唯一需要仓库写权的地方（建 release + 传资产）；**不含** id-token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false # v5 默认反转为 true；本仓无 lockfile 且不 install（同 publish 作业口径）
      # 资产 = `npm pack` 产出的 tgz（与既往手工 release 的附件同名同源）
      - name: 创建 GitHub Release（附 tgz 资产）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 跳过（幂等，可安全重跑）"
            exit 0
          fi
          TARBALL="$(npm pack --silent | tail -n1)"
          echo "资产：$TARBALL"
          gh release create "$TAG" "$TARBALL" \
            --title "$TAG" \
            --generate-notes
          echo "✓ Release $TAG 已创建（body 由 --generate-notes 生成，可在网页上补详细说明）"
