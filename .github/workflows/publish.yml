name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动补 dist-tag（如 latest 未跟随最新版时）

# 默认最小权限（v18.2.6 拆分）：`gates` 作业持有下面这一档；发布令牌只在 `publish` 作业里提权。
permissions:
  contents: read

# 同一 tag 的发布不并发（发布是不可逆动作）
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PKG: lunheng-article-pipeline

jobs:
  # ── 发布前四道门 + 回归测试（v18.2.6 从 publish 作业里拆出来）──────────────────────
  # 为什么拆（第三方审计「CLI 门的外部依赖被排除在供应链考虑之外」）：
  #   门 2 会**从 registry 现场下载并执行**第三方 CLI（`dsh-plugin-guide`，见 scripts/plugin-surface-check.mjs 的
  #   获取链）。此前它跑在**持有 `id-token: write` + `NPM_TOKEN` 的发布作业**里 —— 等于让一个下载来的包在
  #   发布身份面前执行。拆开后：本作业 `contents: read`、**无 id-token、不读任何 secret**，只跑门与测试；
  #   `publish` 作业 `needs: gates`，门失败即**不可能**开始发布。
  # 保守改动声明：只调整作业边界与权限，不改任何既有发布语义（OIDC / `--tag dsh` / 幂等守卫 / gitHead 断言全部保留）。
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions 固定到 commit SHA（v2.5.2-dsh.13）：可移动的大版本 tag 一旦被上游改动即可被利用来发布恶意版本
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'   # 门 2 需要 Node 24：Node 22.19 自带的 npm 10.9.3 无法安装本检查所用的 dsh-plugin-guide
          package-manager-cache: false # v5 把默认值反转为 true；本仓库无 lockfile 且不 pnpm install（v18.2.4 审计 F.1 维持不缓存）

      # ── 四道门（fail-closed：任一不过即中止，绝不发布未校验内容）──────────────────
      - name: 门 1/4 一致性自检（版本/白名单/口径/工具名/CHANGELOG 段落）
        run: node skills/lunheng-article-pipeline/scripts/consistency-check.mjs

      - name: 门 2/4 打包面检查（bundle 契约 + package.json 元数据 + patch 行依赖 + 工程红线）
        # STRICT_WARN=1（v18.2.6）：warn 也阻塞——「0 warn」此前只是文档承诺，代码只看 failed === 0
        env:
          STRICT_WARN: '1'
        run: node scripts/plugin-surface-check.mjs

      - name: 门 3/4 机械卫生门（语法/JSON/YAML/行尾/UTF-8/发布包内容/退出码契约）
        run: node scripts/repo-hygiene-check.mjs

      - name: 门 4/4 打包产物冒烟（npm pack → 解包 → 入口 apply 真跑）
        run: node scripts/pack-smoke.mjs

      - name: 随包脚本回归测试
        run: node --test "tests/**/*.test.mjs"

  # ── 发布（唯一持有发布身份的作业）─────────────────────────────────────────────
  publish:
    needs: gates                 # 门失败即不发布（v18.2.6：断链式依赖，比同作业内串跑更强）
    runs-on: ubuntu-latest
    permissions:
      id-token: write            # 必须：OIDC 信任发布的令牌（只在本作业提权）
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  # v5 setup-node 仍按 packageManager 探测 pnpm（package-manager-cache: false 只关缓存不关探测），故显式装上
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'   # Trusted Publishing 要求 npm ≥11.5.1；Node 24 自带 npm 已满足（不再 `npm i -g npm@latest`，避免发布环境不可复现）
          package-manager-cache: false # v5 把默认值反转为 true；本仓库无 lockfile 且不 pnpm install（v18.2.4 审计 F.1 维持不缓存）
          registry-url: 'https://registry.npmjs.org'

      # 防误发：git tag 名必须与 package.json version 一致（仅 tag 触发时校验）
      - name: 校验 tag 与版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::git tag $TAG 与 package.json version ${VER#v} 不一致，拒绝发布（防版本超前误发）"
            exit 1
          fi

      # 幂等守卫（v2.5.2-dsh.13）：该版本已发布 → 跳过发布（含补打历史 tag 的场景），避免 EPUBLISHCONFLICT 噪声
      - name: 幂等检查（已发布则跳过）
        id: guard
        run: |
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "已存在于 npm：$PKG@$VER → 跳过发布步骤"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "待发布：$PKG@$VER"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # OIDC 信任发布：无需 NPM_TOKEN，--provenance 附来源证明；
      # 预发布版（-dsh.N）显式打 dsh tag（仅 tag 触发且未发布时执行）
      - name: 发布到 npm
        id: publish
        if: startsWith(github.ref, 'refs/tags/') && steps.guard.outputs.skip == 'false'
        run: npm publish --access public --provenance --tag dsh

      # dist-tag 核对与补打。要点（v2.5.2-dsh.13 实测修正）：
      #   ① OIDC 发布已由 `npm publish --tag dsh` 自动把 dsh 指向本次版本 —— **不需要**再 add 一次；
      #   ② 无 token 时 `npm dist-tag add` 会因无鉴权而 exit 1，把整步（并连带跳过发布后审计）弄红 ——
      #      故本步改为「先只读打印，有 token 才写」，**缺** token 时永不失败。
      # v18.2.4 两处修正（实测：v18.2.4 发布时 CI 侧 NPM_TOKEN 已失效 → 本步 E401 红）：
      #   ③ **触发条件补 dispatch**：旧条件只有 `skip == 'false'`，而本工作流的 `workflow_dispatch`
      #      自称用途是「手动补 dist-tag（如 latest 未跟随最新版时）」——可手动跑时目标版本**早已发布**
      #      → 幂等守卫必然把 skip 置真 → 本步被**整个跳过** → **文档承诺的手工补救路径从来不会执行**。
      #      这是「文档声称强于事实」的又一例，只有真的需要补救时才暴露。现改为「待发布」或「手动 dispatch」都跑。
      #   ④ **失败必须可操作（区分「缺」与「失效」）**：缺 token 仍是 warning（设计如此）；但 token
      #      **存在却失效**（E401 = 已撤销/过期）是真问题——它让 latest 静默卡在旧版。故捕获后打
      #      `::error::` 并给出**可直接复制**的补救命令，仍 exit 1（fail-closed，不把「latest 没跟上」伪装成成功）。
      #      v18.2.4 即由维护者在有凭据的机器上执行该命令补齐（latest / dsh 均已 → 18.2.4）。
      - name: 核对 dist-tag（只读；有 token 才补打 latest）
        if: steps.guard.outputs.skip == 'false' || github.event_name == 'workflow_dispatch'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          echo '--- 发布后 dist-tags ---'
          npm view "$PKG" dist-tags --json
          if [ -n "${NPM_TOKEN}" ]; then
            if npm dist-tag add "$PKG@$VER" dsh && npm dist-tag add "$PKG@$VER" latest; then
              echo "已同步 dsh + latest → $VER"
            else
              echo "::error::NPM_TOKEN 存在但鉴权失败（E401 = 令牌已失效或被撤销）——latest 可能仍停在旧版。发布本身已成功、**无需重发**；请在维护者有凭据的机器上执行：npm dist-tag add $PKG@$VER latest && npm dist-tag add $PKG@$VER dsh，并在 npm 侧换发细粒度 token 后 gh secret set NPM_TOKEN"
              exit 1
            fi
          else
            echo "::warning::未配置 NPM_TOKEN —— 仅 dsh 指向本次版本（由 npm publish --tag dsh 自动完成）；latest 仍指旧版。安装请用 $PKG@dsh，或由维护者手工执行：npm dist-tag add $PKG@$VER latest"
          fi
          npm view "$PKG" dist-tags --json

      # 发布后审计：核对 npm 上该版本的 gitHead 与本次提交一致、dist-tag 指向本版本。
      # v2.5.2-dsh.14 修（实测教训）：**registry 元数据有传播延迟**——publish 步骤刚成功就 `npm view gitHead`
      # 会拿到空值，旧写法因此误判「产物与 tag 不对应」并红灯（dsh.14 首跑即如此，事后核验 gitHead 其实完全正确）。
      # 现改为**轮询等待**，并把「取不到」与「取到但不一致」区分开。
      # v2.5.2-dsh.16 再修（dsh.16 首跑实测）：publish 日志明写
      # 「Your package is being processed and may take a few minutes to become available」——**120s 窗口仍不够**
      # （本次 gitHead 实际在 ~10 分钟后可取到，且与 HEAD 完全一致）。故：
      #   ① 窗口放宽到 30 × 15s（≈7.5 分钟），并在等待时提示 npm 的「处理中」语义；
      #   ② **取不到 = 告警**（::warning::，exit 0）——发布步骤自身已由 npm 返回成功 + provenance 签署，
      #      元数据传播延迟不是本仓库缺陷，不该把运行弄红；
      #   ③ **取到但不一致 = 硬错误**（真正的产物/tag 不对应，必须拦）。
      # `always()` 确保即使中间某步失败（如缺 token 的告警步）也仍执行审计——但只在**发布本身成功**时才有意义。
      - name: 发布后审计（gitHead / dist-tags 断言）
        if: always() && startsWith(github.ref, 'refs/tags/') && steps.guard.outputs.skip == 'false' && steps.publish.outcome == 'success'
        run: |
          VER="$(node -p "require('./package.json').version")"
          HEAD="$(git rev-parse HEAD)"
          GITHEAD=""
          for i in $(seq 1 30); do
            GITHEAD="$(npm view "$PKG@$VER" gitHead 2>/dev/null | tr -d '[:space:]')"
            [ -n "$GITHEAD" ] && break
            echo "registry 元数据尚未就绪，等待中（第 $i/30 次，每次 15s）—— npm 可能仍在处理发布（其提示：may take a few minutes to become available）"
            sleep 15
          done
          echo "npm gitHead=$GITHEAD  repo HEAD=$HEAD"
          if [ -z "$GITHEAD" ]; then
            echo "::warning::7.5 分钟内未取到 npm 上 $VER 的 gitHead —— registry 元数据传播延迟（发布本身已成功：publish 步骤退出 0 + provenance 已签署）。请人工核对：npm view $PKG@$VER gitHead 应等于 $HEAD"
          elif [ "$GITHEAD" != "$HEAD" ]; then
            echo "::error::npm 上 $VER 的 gitHead($GITHEAD) ≠ 本次提交($HEAD) —— 发布产物与 tag 不对应（真实缺陷，必须处理）"
            exit 1
          else
            echo "✓ gitHead 与本次提交一致"
          fi
          DSH_TAG="$(npm view "$PKG" dist-tags.dsh 2>/dev/null | tr -d '[:space:]')"
          echo "dist-tags.dsh=$DSH_TAG"
          if [ "$DSH_TAG" != "$VER" ]; then
            echo "::warning::dist-tags.dsh=$DSH_TAG ≠ $VER（若已配置 NPM_TOKEN 则不应发生；无 token 时属预期：publish --tag dsh 会自动指向本版本）"
          fi
