name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动补 dist-tag（如 latest 未跟随最新版时）

permissions:
  id-token: write   # 必须：OIDC 信任发布的令牌
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 Node >= 22.14 + npm >= 11.5.1（官方文档硬性要求）
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # 官方明确：发布构建不要缓存依赖（本包零依赖，无 package-lock）

      # 仓库无 package-lock.json，用 npm install 而非 npm ci；显式升到最新 npm 保证 OIDC 交换可用
      - name: 安装依赖
        run: |
          npm install --global-style --no-package-lock
          npm install -g npm@latest

      # 一致性自检（复用现有脚本，与 ci.yml 同门——发布前 P0 漂移必须阻断）
      - name: 一致性自检
        run: node skills/lunheng-article-pipeline/scripts/consistency-check.mjs

      # 防误发：git tag 名必须与 package.json version 一致（仅 tag 触发时校验）
      - name: 校验 tag 与版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::git tag $TAG 与 package.json version ${VER#v} 不一致，拒绝发布（防版本超前误发）"
            exit 1
          fi

      # OIDC 信任发布：无需 NPM_TOKEN，--provenance 附来源证明；
      # 预发布版（-dsh.N）显式打 dsh tag（仅 tag 触发时发布）
      - name: 发布到 npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public --provenance --tag dsh

      # 确保 dsh dist-tag 指向本次版本（OIDC 发布已打 dsh tag，此步为漂移兜底）。
      # 注意：OIDC 令牌无权修改 dist-tag（npm 只授权 publish），设 latest 需 owner 的
      # granular+bypass2FA token——故本步只在设置了 NPM_TOKEN secret 时才执行，否则跳过。
      - name: 确认 dist-tag
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          npm dist-tag add lunheng-article-pipeline@$VER dsh
          npm dist-tag add lunheng-article-pipeline@$VER latest
